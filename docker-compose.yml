services:
  xgen_db_init:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: xgen_db_init
    volumes:
      - xgen_db_data:/app/apps/api/data
    command: sh -c "cd apps/api && npx prisma db push"

  xgen:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: xgen_enterprise
    environment:
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://host.docker.internal:3001}
      # Onde o usuário abre o editor de PPTX (painel web). Padrão: mesmo host, porta 3000.
      - PUBLIC_WEB_URL=${PUBLIC_WEB_URL:-}
      # Opcional: de onde buscar as imagens anexadas no chat (o painel web tem prioridade)
      - OPENWEBUI_URL=${OPENWEBUI_URL:-}
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000" # Painel Web (Next.js)
      - "3001:3001" # API HTTP Express
    volumes:
      # Mantém os PDFs e DOCX exportados persistidos na sua máquina real
      # (o código resolve o caminho relativo ao dist compilado: apps/api/dist/../exports)
      - ./exports:/app/apps/api/exports
      # Persistência do Banco de Dados SQLite (Seguro - Docker Volumes).
      # Montado em data/ (não em prisma/) para não esconder o schema.prisma atualizado.
      - xgen_db_data:/app/apps/api/data
      # Persistência da Fila do Redis
      - xgen_redis_data:/var/lib/redis
      # Apresentações editáveis (links "Editar" do chat) e imagens recebidas
      - xgen_storage:/app/apps/api/storage
    restart: unless-stopped
    depends_on:
      xgen_db_init:
        condition: service_completed_successfully

volumes:
  xgen_db_data:
  xgen_redis_data:
  xgen_storage:
